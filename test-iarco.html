<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Satisfacción - Iarco</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --primary: #001F4D;
            --secondary: #CDDC39;
            --accent: #003D82;
            --light: #F5F7FA;
            --dark: #1A1A1A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #EEF2FF 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
            line-height: 1.5;
        }

        .content {
            padding: 40px;
            min-height: 400px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
            font-size: 15px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: #FFFEF0;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--secondary);
        }

        .progress {
            height: 6px;
            background: #E0E0E0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: width 0.3s ease;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 111, 71, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: #FFFEF0;
        }

        .success-message {
            text-align: center;
            padding: 60px 30px;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .success-message h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .success-message p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-item:hover {
            border-color: var(--primary);
            background: #FFFEF0;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .error-message {
            color: #DC2626;
            font-size: 13px;
            margin-top: 6px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 3px solid #E0E0E0;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .step-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E0E0E0;
            transition: all 0.3s;
        }

        .step-dot.active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TestIarco() {
            const [step, setStep] = useState(0);
            const [loading, setLoading] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [errors, setErrors] = useState({});
            const [formData, setFormData] = useState({
                nombre: '',
                email: '',
                genero: '',
                fechaNacimiento: '',
                rango_edad: '',
                proyectos: [],
                satisfaccion_compra: '',
                mejorias: '',
                apoyo_esperado: [],
                cambio_vivienda: '',
                hijos: '',
                mascotas: '',
                personas_tercera_edad: '',
                recomendacion: '',
                contacto: ''
            });

            const proyectosOptions = [
                'Alejandría',
                'Quintas de Alejandría',
                'Álamos Plaza',
                'Amaru',
                'Tisu',
                'Yarima',
                'Malabar Reservado',
                'Bali',
                'Viventi',
                'Alcázares',
                'Mirador de la Estancia'
            ];

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
                if (errors[name]) {
                    setErrors(prev => ({
                        ...prev,
                        [name]: ''
                    }));
                }
            };

            const handleCheckboxChange = (name, value) => {
                setFormData(prev => ({
                    ...prev,
                    [name]: prev[name].includes(value)
                        ? prev[name].filter(item => item !== value)
                        : [...prev[name], value]
                }));
            };

            const validateStep = () => {
                const newErrors = {};

                if (step === 0) {
                    if (!formData.nombre.trim()) newErrors.nombre = 'El nombre es requerido';
                    if (!formData.email.trim()) newErrors.email = 'El email es requerido';
                    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
                        newErrors.email = 'Email inválido';
                    }
                }

                if (step === 1) {
                    if (!formData.genero) newErrors.genero = 'Selecciona tu género';
                    if (!formData.fechaNacimiento) newErrors.fechaNacimiento = 'La fecha de nacimiento es requerida';
                    if (!formData.rango_edad) newErrors.rango_edad = 'Selecciona tu rango de edad';
                    if (formData.proyectos.length === 0) newErrors.proyectos = 'Selecciona al menos un proyecto';
                }

                if (step === 2) {
                    if (!formData.satisfaccion_compra) newErrors.satisfaccion_compra = 'Selecciona una opción';
                    if (formData.apoyo_esperado.length === 0) newErrors.apoyo_esperado = 'Selecciona al menos una opción';
                }

                if (step === 3) {
                    if (!formData.cambio_vivienda) newErrors.cambio_vivienda = 'Selecciona una opción';
                }

                if (step === 4) {
                    if (!formData.hijos) newErrors.hijos = 'Selecciona una opción';
                    if (!formData.mascotas) newErrors.mascotas = 'Selecciona una opción';
                    if (!formData.personas_tercera_edad) newErrors.personas_tercera_edad = 'Selecciona una opción';
                }

                if (step === 5) {
                    if (!formData.recomendacion) newErrors.recomendacion = 'Selecciona una opción';
                }

                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleNext = () => {
                if (validateStep()) {
                    setStep(step + 1);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validateStep()) return;

                setLoading(true);

                const formDataToSend = new FormData();
                Object.keys(formData).forEach(key => {
                    if (Array.isArray(formData[key])) {
                        formDataToSend.append(key, formData[key].join(', '));
                    } else {
                        formDataToSend.append(key, formData[key]);
                    }
                });
                formDataToSend.append('fecha_envio', new Date().toLocaleString('es-CO'));

                try {
                    const response = await fetch('https://formspree.io/f/xyzpdrvj', {
                        method: 'POST',
                        body: formDataToSend,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        setSubmitted(true);
                        setLoading(false);
                    } else {
                        alert('Hubo un error. Por favor intenta de nuevo.');
                        setLoading(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error de conexión. Por favor intenta de nuevo.');
                    setLoading(false);
                }
            };

            const progressPercent = ((step) / 6) * 100;
            const totalSteps = 6;

            if (submitted) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>¡Gracias por tu participación!</h1>
                        </div>
                        <div className="success-message">
                            <div className="success-icon">✓</div>
                            <h2>Tu respuesta fue enviada</h2>
                            <p>Pronto recibirás en tu email tu <strong>Reporte Personalizado: Valorización de tu Inversión Inmobiliaria + Guía de Oportunidades 2026</strong></p>
                            <p style={{fontSize: '13px', color: '#999'}}>Este reporte incluye:</p>
                            <ul style={{textAlign: 'left', fontSize: '13px', color: '#666', lineHeight: '1.8', marginTop: '15px'}}>
                                <li>✓ Estimado de valorización de tu propiedad desde tu compra</li>
                                <li>✓ Análisis del mercado inmobiliario Pereira 2026</li>
                                <li>✓ Proyectos nuevos alineados con tu perfil de inversión</li>
                                <li>✓ Opciones de refinanciamiento y valor agregado</li>
                            </ul>
                            <p style={{fontSize: '13px', color: '#999', marginTop: '25px'}}>Te contactaremos en los próximos 3 días hábiles</p>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>Enviando tu información...</h1>
                        </div>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Por favor espera</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>Iarco</h1>
                        <p>Estudio de Satisfacción y Oportunidades para Nuestros Inversionistas</p>
                    </div>

                    <div className="content">
                        <div className="progress">
                            <div className="progress-bar" style={{width: `${progressPercent}%`}}></div>
                        </div>

                        <div className="step-indicator">
                            {Array.from({length: totalSteps}).map((_, i) => (
                                <div key={i} className={`step-dot ${i === step ? 'active' : ''}`}></div>
                            ))}
                        </div>

                        <form onSubmit={handleSubmit}>
                            {/* PASO 0: Datos Básicos */}
                            {step === 0 && (
                                <>
                                    <h2 className="section-title">Cuéntanos quién eres</h2>
                                    <div className="form-group">
                                        <label>Nombre completo *</label>
                                        <input
                                            type="text"
                                            name="nombre"
                                            value={formData.nombre}
                                            onChange={handleInputChange}
                                            placeholder="Tu nombre"
                                        />
                                        {errors.nombre && <div className="error-message">{errors.nombre}</div>}
                                    </div>
                                    <div className="form-group">
                                        <label>Email *</label>
                                        <input
                                            type="email"
                                            name="email"
                                            value={formData.email}
                                            onChange={handleInputChange}
                                            placeholder="tu@email.com"
                                        />
                                        {errors.email && <div className="error-message">{errors.email}</div>}
                                    </div>
                                </>
                            )}

                            {/* PASO 1: Demográficos */}
                            {step === 1 && (
                                <>
                                    <h2 className="section-title">Información Personal</h2>
                                    <div className="form-group">
                                        <label>Género *</label>
                                        <select name="genero" value={formData.genero} onChange={handleInputChange}>
                                            <option value="">Selecciona</option>
                                            <option value="Masculino">Masculino</option>
                                            <option value="Femenino">Femenino</option>
                                            <option value="Otro">Otro</option>
                                            <option value="Prefiero no decir">Prefiero no decir</option>
                                        </select>
                                        {errors.genero && <div className="error-message">{errors.genero}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>Fecha de nacimiento *</label>
                                        <input
                                            type="date"
                                            name="fechaNacimiento"
                                            value={formData.fechaNacimiento}
                                            onChange={handleInputChange}
                                        />
                                        {errors.fechaNacimiento && <div className="error-message">{errors.fechaNacimiento}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>Rango de edad *</label>
                                        <select name="rango_edad" value={formData.rango_edad} onChange={handleInputChange}>
                                            <option value="">Selecciona</option>
                                            <option value="18-30">18-30 años</option>
                                            <option value="31-40">31-40 años</option>
                                            <option value="41-50">41-50 años</option>
                                            <option value="51-60">51-60 años</option>
                                            <option value="60+">60+ años</option>
                                        </select>
                                        {errors.rango_edad && <div className="error-message">{errors.rango_edad}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>¿En cuál(es) proyecto(s) de Iarco compraste? *</label>
                                        <div className="checkbox-group">
                                            {proyectosOptions.map(proyecto => (
                                                <label key={proyecto} className="checkbox-item">
                                                    <input
                                                        type="checkbox"
                                                        checked={formData.proyectos.includes(proyecto)}
                                                        onChange={() => handleCheckboxChange('proyectos', proyecto)}
                                                    />
                                                    <span>{proyecto}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.proyectos && <div className="error-message">{errors.proyectos}</div>}
                                    </div>
                                </>
                            )}

                            {/* PASO 2: Experiencia de Compra */}
                            {step === 2 && (
                                <>
                                    <h2 className="section-title">Tu Experiencia con Iarco</h2>
                                    <div className="form-group">
                                        <label>¿Qué tan satisfecho estás con tu compra en Iarco? *</label>
                                        <div className="radio-group">
                                            {['Muy insatisfecho', 'Insatisfecho', 'Neutral', 'Satisfecho', 'Muy satisfecho'].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="satisfaccion_compra"
                                                        value={option}
                                                        checked={formData.satisfaccion_compra === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.satisfaccion_compra && <div className="error-message">{errors.satisfaccion_compra}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>¿Qué mejoraría de tu experiencia con Iarco?</label>
                                        <textarea
                                            name="mejorias"
                                            value={formData.mejorias}
                                            onChange={handleInputChange}
                                            placeholder="Cuéntanos qué podríamos haber hecho mejor..."
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>¿En cuál(es) de estos servicios te gustaría que Iarco te apoye? *</label>
                                        <div className="checkbox-group">
                                            {[
                                                'Refinanciamiento o renegociación de términos',
                                                'Reforma, ampliación o mejoras a la propiedad',
                                                'Vender mi propiedad actual',
                                                'Comprar una nueva inversión inmobiliaria',
                                                'Asesoría sobre cómo rentabilizar mi propiedad',
                                                'Gestión de arrendamiento (inquilino)',
                                                'Trámites legales o notariales',
                                                'Avalúo y valuación de mi propiedad',
                                                'No requiero apoyo en este momento'
                                            ].map(opcion => (
                                                <label key={opcion} className="checkbox-item">
                                                    <input
                                                        type="checkbox"
                                                        checked={formData.apoyo_esperado.includes(opcion)}
                                                        onChange={() => handleCheckboxChange('apoyo_esperado', opcion)}
                                                    />
                                                    <span>{opcion}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.apoyo_esperado && <div className="error-message">{errors.apoyo_esperado}</div>}
                                    </div>
                                </>
                            )}

                            {/* PASO 3: Planes Futuros */}
                            {step === 3 && (
                                <>
                                    <h2 className="section-title">Tus Planes Futuros</h2>
                                    <div className="form-group">
                                        <label>¿Cuál es tu situación actual con la vivienda? *</label>
                                        <div className="radio-group">
                                            {[
                                                'Vivo en ella y no pienso cambiar',
                                                'Vivo en ella pero podría venderla en 1-2 años',
                                                'Vivo en ella y quiero cambiar pronto',
                                                'La tengo arrendada como inversión',
                                                'La tengo sin usar (especulación)',
                                                'Desocupada, podría rentarla'
                                            ].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="cambio_vivienda"
                                                        value={option}
                                                        checked={formData.cambio_vivienda === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.cambio_vivienda && <div className="error-message">{errors.cambio_vivienda}</div>}
                                    </div>
                                </>
                            )}

                            {/* PASO 4: Familia */}
                            {step === 4 && (
                                <>
                                    <h2 className="section-title">Tu Familia</h2>
                                    <div className="form-group">
                                        <label>¿Tienes hijos? *</label>
                                        <div className="radio-group">
                                            {['No', 'Sí, menores de edad', 'Sí, mayores de edad', 'Ambos'].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="hijos"
                                                        value={option}
                                                        checked={formData.hijos === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.hijos && <div className="error-message">{errors.hijos}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>¿Tienes mascotas? *</label>
                                        <div className="radio-group">
                                            {['No', 'Sí, perro(s)', 'Sí, gato(s)', 'Otras mascotas', 'Varias'].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="mascotas"
                                                        value={option}
                                                        checked={formData.mascotas === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.mascotas && <div className="error-message">{errors.mascotas}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>¿Viven contigo personas de la tercera edad? *</label>
                                        <div className="radio-group">
                                            {['No', 'Sí, una persona', 'Sí, dos o más personas'].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="personas_tercera_edad"
                                                        value={option}
                                                        checked={formData.personas_tercera_edad === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.personas_tercera_edad && <div className="error-message">{errors.personas_tercera_edad}</div>}
                                    </div>
                                </>
                            )}

                            {/* PASO 5: Final */}
                            {step === 5 && (
                                <>
                                    <h2 className="section-title">Casi Listo</h2>
                                    <div className="form-group">
                                        <label>¿Recomendarías a Iarco a amigos o familiares? *</label>
                                        <div className="radio-group">
                                            {['No', 'Tal vez', 'Probablemente', 'Definitivamente sí'].map(option => (
                                                <label key={option} className="radio-item">
                                                    <input
                                                        type="radio"
                                                        name="recomendacion"
                                                        value={option}
                                                        checked={formData.recomendacion === option}
                                                        onChange={handleInputChange}
                                                    />
                                                    <span>{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                        {errors.recomendacion && <div className="error-message">{errors.recomendacion}</div>}
                                    </div>

                                    <div className="form-group">
                                        <label>¿Cómo prefieres que nos comuniquemos contigo?</label>
                                        <select name="contacto" value={formData.contacto} onChange={handleInputChange}>
                                            <option value="">Selecciona</option>
                                            <option value="Email">Email</option>
                                            <option value="WhatsApp">WhatsApp</option>
                                            <option value="Llamada">Llamada telefónica</option>
                                            <option value="Preferencia abierta">Sin preferencia</option>
                                        </select>
                                    </div>

                                    <div style={{background: '#FFFEF0', padding: '20px', borderRadius: '8px', marginTop: '25px'}}>
                                        <p style={{fontSize: '14px', lineHeight: '1.6', color: 'var(--dark)', margin: 0}}>
                                            <strong>✓ Tu información es segura</strong><br/>
                                            Usaremos tus datos solo para enviarte tu reporte personalizado y mantenerte informado sobre oportunidades alineadas con tu perfil.
                                        </p>
                                    </div>
                                </>
                            )}

                            <div className="button-group">
                                {step > 0 && (
                                    <button type="button" className="btn-secondary" onClick={() => setStep(step - 1)}>
                                        Atrás
                                    </button>
                                )}
                                {step < 5 && (
                                    <button type="button" className="btn-primary" onClick={handleNext}>
                                        Siguiente
                                    </button>
                                )}
                                {step === 5 && (
                                    <button type="submit" className="btn-primary">
                                        Enviar y Recibir Reporte
                                    </button>
                                )}
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TestIarco />, document.getElementById('root'));
    </script>
</body>
</html>
